<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1540 720" role="img" aria-labelledby="title desc">
  <title id="title">AI booking state and decision flow</title>
  <desc id="desc">The BookingSession state machine moves from greeting to qualification, provider-backed slot offering, selection, exact confirmation, and booking. Ineligible or uncertain qualification, empty availability, and unoffered choices hand off. Confirmation mismatch raises an error without creating a booking. Changing the slot loops back to offer slot.</desc>

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,4 L0,8 Z" fill="#334155"/>
    </marker>
    <style>
      .bg { fill: #ffffff; }
      .line { fill: none; stroke: #334155; stroke-width: 2; marker-end: url(#arrow); }
      .dash { fill: none; stroke: #64748b; stroke-width: 1.8; stroke-dasharray: 7 6; marker-end: url(#arrow); }
      .state { fill: #f8fafc; stroke: #0f172a; stroke-width: 2; rx: 7; }
      .action { fill: #f0fdf4; stroke: #166534; stroke-width: 1.8; rx: 5; }
      .input { fill: #ffffff; stroke: #64748b; stroke-width: 1.6; stroke-dasharray: 6 5; rx: 4; }
      .decision { fill: #ffffff; stroke: #0f172a; stroke-width: 2; }
      .handoff { fill: #fff7ed; stroke: #9a3412; stroke-width: 2; rx: 7; }
      .reject { fill: #fef2f2; stroke: #b91c1c; stroke-width: 2; rx: 7; }
      .booking { fill: #ecfdf5; stroke: #047857; stroke-width: 2; rx: 7; }
      .end { fill: #0f172a; stroke: #0f172a; stroke-width: 2; rx: 7; }
      .title { font: 700 24px Arial, sans-serif; fill: #0f172a; }
      .subtitle { font: 14px Arial, sans-serif; fill: #475569; }
      .label { font: 700 13px "Courier New", monospace; fill: #0f172a; text-anchor: middle; }
      .small { font: 12px Arial, sans-serif; fill: #475569; text-anchor: middle; }
      .edge { font: 700 11px Arial, sans-serif; fill: #334155; }
      .edge-red { font: 700 11px Arial, sans-serif; fill: #b91c1c; }
      .edge-orange { font: 700 11px Arial, sans-serif; fill: #9a3412; }
      .edge-green { font: 700 11px Arial, sans-serif; fill: #166534; }
      .inverse { font: 700 13px "Courier New", monospace; fill: #ffffff; text-anchor: middle; }
      .note { font: 12px "Courier New", monospace; fill: #64748b; }
    </style>
  </defs>

  <rect class="bg" width="1540" height="720"/>
  <text x="40" y="42" class="title">BookingSession — state / decision flow</text>
  <text x="40" y="66" class="subtitle">Only transitions and failure paths implemented on current main are shown.</text>

  <rect class="state" x="40" y="120" width="126" height="56"/>
  <text class="label" x="103" y="153">GREETING</text>

  <rect class="state" x="216" y="120" width="126" height="56"/>
  <text class="label" x="279" y="153">QUALIFY</text>

  <polygon class="decision" points="472,98 572,148 472,198 372,148"/>
  <text class="small" x="472" y="140">eligible</text>
  <text class="small" x="472" y="157">AND confident?</text>

  <rect class="state" x="622" y="120" width="146" height="56"/>
  <text class="label" x="695" y="153">OFFER_SLOT</text>

  <rect class="input" x="806" y="30" width="178" height="54"/>
  <text class="label" x="895" y="53">provider slots</text>
  <text class="small" x="895" y="72">list[str]</text>

  <rect class="action" x="806" y="114" width="178" height="68"/>
  <text class="label" x="895" y="142">normalize_slots()</text>
  <text class="small" x="895" y="162">trim · drop blanks · dedupe</text>

  <polygon class="decision" points="1110,98 1206,148 1110,198 1014,148"/>
  <text class="small" x="1110" y="140">any usable</text>
  <text class="small" x="1110" y="157">slots?</text>

  <rect class="action" x="1250" y="114" width="214" height="68"/>
  <text class="label" x="1357" y="141">store offered_slots</text>
  <text class="small" x="1357" y="161">offer only normalized values</text>

  <polygon class="decision" points="1210,274 1310,324 1210,374 1110,324"/>
  <text class="small" x="1210" y="315">chosen slot in</text>
  <text class="small" x="1210" y="332">offered_slots?</text>

  <rect class="state" x="900" y="296" width="146" height="56"/>
  <text class="label" x="973" y="320">CONFIRM</text>
  <text class="small" x="973" y="341">selected_slot = offered choice</text>

  <polygon class="decision" points="708,270 824,324 708,378 592,324"/>
  <text class="small" x="708" y="307">confirmed == selected</text>
  <text class="small" x="708" y="325">AND confirmed in</text>
  <text class="small" x="708" y="343">offered_slots?</text>

  <rect class="booking" x="370" y="296" width="164" height="56"/>
  <text class="label" x="452" y="321">Booking(slot)</text>
  <text class="small" x="452" y="340">validated booking value</text>

  <rect class="end" x="160" y="296" width="126" height="56"/>
  <text class="inverse" x="223" y="329">END</text>

  <rect class="handoff" x="240" y="500" width="184" height="66"/>
  <text class="label" x="332" y="528">HANDOFF</text>
  <text class="small" x="332" y="549">human continuation</text>

  <rect class="reject" x="570" y="500" width="284" height="78"/>
  <text class="label" x="712" y="528">REJECT CONFIRMATION</text>
  <text class="small" x="712" y="549">ValueError · no Booking</text>
  <text class="small" x="712" y="566">state remains CONFIRM</text>

  <rect class="reject" x="1218" y="486" width="282" height="78"/>
  <text class="label" x="1359" y="514">REJECT BAD INPUT / STATE</text>
  <text class="small" x="1359" y="535">non-string slot or invalid transition</text>
  <text class="small" x="1359" y="552">raises ValueError</text>

  <path class="line" d="M166 148 H216"/>
  <text class="edge" x="181" y="137">begin()</text>

  <path class="line" d="M342 148 H372"/>
  <path class="line" d="M572 148 H622"/>
  <text class="edge-green" x="584" y="137">YES</text>

  <path class="dash" d="M895 84 V114"/>
  <path class="line" d="M768 148 H806"/>
  <text class="edge" x="774" y="137">offer(slots)</text>

  <path class="line" d="M984 148 H1014"/>
  <path class="line" d="M1206 148 H1250"/>
  <text class="edge-green" x="1217" y="137">YES</text>

  <path class="line" d="M1357 182 V244 H1210 V274"/>
  <text class="edge" x="1272" y="234">choose(slot)</text>

  <path class="line" d="M1110 324 H1046"/>
  <text class="edge-green" x="1060" y="313">YES</text>

  <path class="line" d="M900 324 H824"/>
  <text class="edge" x="840" y="313">confirm(slot)</text>

  <path class="line" d="M592 324 H534"/>
  <text class="edge-green" x="546" y="313">YES</text>

  <path class="line" d="M370 324 H286"/>

  <path class="line" d="M472 198 H320 V470 H332 V500"/>
  <text class="edge-orange" x="483" y="219">NO → ineligible / low confidence</text>

  <path class="line" d="M1110 198 V430 H400 V500"/>
  <text class="edge-orange" x="1121" y="219">NO → empty after normalization</text>

  <path class="line" d="M1210 374 V450 H400 V500"/>
  <text class="edge-orange" x="1222" y="397">NO → unoffered choice</text>

  <path class="line" d="M332 500 V410 H223 V352"/>
  <text class="edge" x="236" y="399">finish_handoff()</text>

  <path class="line" d="M708 378 V500"/>
  <text class="edge-red" x="720" y="401">NO</text>

  <path class="line" d="M973 296 V236 H695 V176"/>
  <text class="edge" x="792" y="226">change_slot() · clear selected_slot</text>

  <path class="dash" d="M895 182 V456 H1359 V486"/>
  <text class="edge-red" x="908" y="205">non-string provider slot</text>

  <line x1="40" y1="626" x2="1500" y2="626" stroke="#cbd5e1"/>
  <text x="40" y="654" class="note">Not implemented in this public core: provider SDK · persistence · stale-slot revalidation · external calendar write.</text>
  <text x="40" y="678" class="note">Any method called from the wrong state is rejected by _require(...) with ValueError.</text>
</svg>
