<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1560" role="img" aria-labelledby="title desc">
  <title id="title">AI booking state and decision flow</title>
  <desc id="desc">The BookingSession state machine moves from greeting to qualification, slot offering, selection, exact confirmation, and booking. Ineligible or uncertain qualification, empty availability, and unoffered choices hand off. Confirmation mismatch raises an error without creating a booking. Changing the slot loops back to offer slot.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,4 L0,8 Z" fill="#334155"/>
    </marker>
    <style>
      .line { fill: none; stroke: #334155; stroke-width: 2; marker-end: url(#arrow); }
      .dash { fill: none; stroke: #64748b; stroke-width: 1.8; stroke-dasharray: 7 6; marker-end: url(#arrow); }
      .state { fill: #f8fafc; stroke: #0f172a; stroke-width: 2; rx: 7; }
      .action { fill: #f0fdf4; stroke: #166534; stroke-width: 1.8; rx: 5; }
      .input { fill: #ffffff; stroke: #64748b; stroke-width: 1.6; stroke-dasharray: 6 5; rx: 4; }
      .decision { fill: #ffffff; stroke: #0f172a; stroke-width: 2; }
      .handoff { fill: #fff7ed; stroke: #9a3412; stroke-width: 2; rx: 7; }
      .reject { fill: #fef2f2; stroke: #b91c1c; stroke-width: 2; rx: 7; }
      .booking { fill: #ecfdf5; stroke: #047857; stroke-width: 2; rx: 7; }
      .end { fill: #0f172a; stroke: #0f172a; stroke-width: 2; rx: 7; }
      .title { font: 700 24px Arial, sans-serif; fill: #0f172a; }
      .subtitle { font: 16px Arial, sans-serif; fill: #475569; }
      .label { font: 700 17px "Courier New", monospace; fill: #0f172a; text-anchor: middle; }
      .small { font: 16px Arial, sans-serif; fill: #475569; text-anchor: middle; }
      .edge { font: 700 16px Arial, sans-serif; fill: #334155; }
      .edge-red { font: 700 16px Arial, sans-serif; fill: #b91c1c; }
      .edge-orange { font: 700 16px Arial, sans-serif; fill: #9a3412; }
      .edge-green { font: 700 16px Arial, sans-serif; fill: #166534; }
      .inverse { font: 700 17px "Courier New", monospace; fill: #ffffff; text-anchor: middle; }
      .note { font: 16px Arial, sans-serif; fill: #475569; }
    </style>
  </defs>
  <rect fill="#ffffff" width="900" height="1560"/>
  <text x="30" y="34" class="title">BookingSession — state / decision flow</text>
  <text x="30" y="60" class="subtitle">Implemented transitions; booking ends at a validated value.</text>

  <rect class="state" x="190" y="85" width="220" height="50"/>
  <text class="label" x="300" y="116">GREETING</text>
  <path class="line" d="M300 135 V185"/>
  <text class="edge" x="318" y="166">begin()</text>
  <rect class="state" x="190" y="185" width="220" height="50"/>
  <text class="label" x="300" y="216">QUALIFY</text>
  <path class="line" d="M300 235 V265"/>
  <polygon class="decision" points="300,265 440,320 300,375 160,320"/>
  <text class="small" x="300" y="314">eligible</text>
  <text class="small" x="300" y="336">AND confident?</text>
  <path class="line" d="M300 375 V415"/>
  <text class="edge-green" x="318" y="402">YES</text>
  <rect class="state" x="190" y="415" width="220" height="50"/>
  <text class="label" x="300" y="446">OFFER_SLOT</text>

  <rect class="input" x="640" y="415" width="230" height="60"/>
  <text class="label" x="755" y="440">supplied slots</text>
  <text class="small" x="755" y="462">list[str]</text>
  <!-- Gaps at the handoff trunk mark crossings, not joins. -->
  <path d="M640 445 H605" fill="none" stroke="#64748b" stroke-width="1.8" stroke-dasharray="7 6"/>
  <path class="dash" d="M585 445 H510 V540 H440"/>
  <path class="line" d="M300 465 V505"/>
  <text class="edge" x="318" y="493">offer(slots)</text>
  <rect class="action" x="160" y="505" width="280" height="70"/>
  <text class="label" x="300" y="534">normalize_slots()</text>
  <text class="small" x="300" y="557">trim · drop blanks · dedupe</text>
  <path class="line" d="M300 575 V605"/>
  <polygon class="decision" points="300,605 440,660 300,715 160,660"/>
  <text class="small" x="300" y="654">any usable</text>
  <text class="small" x="300" y="676">slots?</text>
  <path class="line" d="M300 715 V755"/>
  <text class="edge-green" x="318" y="742">YES</text>
  <rect class="action" x="160" y="755" width="280" height="60"/>
  <text class="label" x="300" y="779">store offered_slots</text>
  <text class="small" x="300" y="802">offer only normalized values</text>
  <path class="line" d="M300 815 V865"/>
  <text class="edge" x="318" y="849">choose(slot)</text>
  <polygon class="decision" points="300,865 440,920 300,975 160,920"/>
  <text class="small" x="300" y="914">chosen slot in</text>
  <text class="small" x="300" y="936">offered_slots?</text>
  <path class="line" d="M300 975 V1015"/>
  <text class="edge-green" x="318" y="1002">YES</text>
  <rect class="state" x="185" y="1015" width="230" height="70"/>
  <text class="label" x="300" y="1041">CONFIRM</text>
  <text class="small" x="300" y="1064">selected_slot = offered choice</text>
  <path class="line" d="M300 1085 V1125"/>
  <text class="edge" x="318" y="1112">confirm(slot)</text>
  <polygon class="decision" points="300,1125 450,1190 300,1255 150,1190"/>
  <text class="small" x="300" y="1173">confirmed == selected</text>
  <text class="small" x="300" y="1195">AND confirmed in</text>
  <text class="small" x="300" y="1217">offered_slots?</text>
  <path class="line" d="M300 1255 V1295"/>
  <text class="edge-green" x="318" y="1282">YES</text>
  <rect class="booking" x="175" y="1295" width="250" height="60"/>
  <text class="label" x="300" y="1320">Booking(slot)</text>
  <text class="small" x="300" y="1343">validated booking value</text>
  <path class="line" d="M300 1355 V1395"/>
  <rect class="end" x="205" y="1395" width="190" height="50"/>
  <text class="inverse" x="300" y="1426">END</text>

  <!-- Three handoff branches join the same state. -->
  <path class="line" d="M440 320 H595 V940 H620"/>
  <text class="edge-orange" x="456" y="275">NO: ineligible</text>
  <text class="edge-orange" x="456" y="297">/ low confidence</text>
  <path d="M440 660 H595" fill="none" stroke="#334155" stroke-width="2"/>
  <text class="edge-orange" x="456" y="615">NO: empty after</text>
  <text class="edge-orange" x="456" y="637">normalization</text>
  <path d="M440 920 H595" fill="none" stroke="#334155" stroke-width="2"/>
  <text class="edge-orange" x="456" y="875">NO: unoffered</text>
  <text class="edge-orange" x="456" y="897">choice</text>
  <circle cx="595" cy="660" r="4" fill="#334155"/>
  <circle cx="595" cy="920" r="4" fill="#334155"/>
  <rect class="handoff" x="620" y="900" width="250" height="80"/>
  <text class="label" x="745" y="933">HANDOFF</text>
  <text class="small" x="745" y="960">human continuation</text>
  <path class="line" d="M745 980 H885 V1420 H395"/>
  <text class="edge" x="620" y="1407">finish_handoff()</text>

  <!-- Caller may return to offering; confirmation errors do not transition. -->
  <path class="line" d="M185 1050 H55 V440 H190"/>
  <text class="edge" x="65" y="1028">change_slot()</text>
  <text class="edge" x="65" y="1075">clear</text>
  <text class="edge" x="65" y="1097">selected_slot</text>
  <path class="line" d="M450 1190 H620"/>
  <text class="edge-red" x="485" y="1177">NO</text>
  <rect class="reject" x="620" y="1145" width="250" height="95"/>
  <text class="label" x="745" y="1174">REJECT CONFIRMATION</text>
  <text class="small" x="745" y="1200">ValueError · no Booking</text>
  <text class="small" x="745" y="1223">state remains CONFIRM</text>

  <path d="M440 558 H585" fill="none" stroke="#64748b" stroke-width="1.8" stroke-dasharray="7 6"/>
  <path class="dash" d="M605 558 H610 V615 H620"/>
  <text class="edge-red" x="620" y="546">non-string supplied slot</text>
  <rect class="reject" x="620" y="570" width="250" height="90"/>
  <text class="label" x="745" y="599">REJECT BAD INPUT</text>
  <text class="small" x="745" y="624">ValueError</text>
  <text class="small" x="745" y="647">no state transition</text>

  <line x1="30" y1="1475" x2="870" y2="1475" stroke="#cbd5e1"/>
  <text x="30" y="1501" class="note">Wrong-state method calls raise ValueError; no transition or Booking is created.</text>
  <text x="30" y="1525" class="note">Not implemented: provider SDK, persistence, stale-slot revalidation,</text>
  <text x="30" y="1547" class="note">or external calendar write.</text>
</svg>
