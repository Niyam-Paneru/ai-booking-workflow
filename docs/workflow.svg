<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="t d">
<title id="t">Booking truth overlap</title><desc id="d">Offered, selected, and still-valid slots overlap to become bookable.</desc>
<rect width="1200" height="520" fill="#f5f5f1"/>
<text x="58" y="64" fill="#71716a" font-family="Arial,sans-serif" font-size="14" letter-spacing="3">BOOKING TRUTH</text>
<text x="58" y="108" fill="#171714" font-family="Georgia,serif" font-size="35">A slot becomes bookable only after three truths agree.</text>
<circle cx="455" cy="292" r="150" fill="#e4edb0" fill-opacity=".82" stroke="#596e35" stroke-width="2"/>
<circle cx="625" cy="292" r="150" fill="#dce9de" fill-opacity=".82" stroke="#4f7555" stroke-width="2"/>
<circle cx="540" cy="385" r="150" fill="#f1d9dc" fill-opacity=".82" stroke="#a4243b" stroke-width="2"/>
<text x="385" y="245" text-anchor="middle" fill="#171714" font-family="Arial,sans-serif" font-size="20" font-weight="700">offered</text><text x="385" y="270" text-anchor="middle" fill="#4e4e48" font-family="Arial,sans-serif" font-size="15">provider returned it</text>
<text x="695" y="245" text-anchor="middle" fill="#171714" font-family="Arial,sans-serif" font-size="20" font-weight="700">selected</text><text x="695" y="270" text-anchor="middle" fill="#4e4e48" font-family="Arial,sans-serif" font-size="15">caller chose it</text>
<text x="540" y="452" text-anchor="middle" fill="#171714" font-family="Arial,sans-serif" font-size="20" font-weight="700">still valid</text>
<circle cx="540" cy="326" r="52" fill="#171714"/><text x="540" y="321" text-anchor="middle" fill="#fff" font-family="Arial,sans-serif" font-size="14" letter-spacing="2">BOOK</text><text x="540" y="344" text-anchor="middle" fill="#fff" font-family="Arial,sans-serif" font-size="13">exact slot</text>
<text x="1110" y="455" text-anchor="end" fill="#71716a" font-family="Arial,sans-serif" font-size="14">anything else → human handoff</text>
</svg>