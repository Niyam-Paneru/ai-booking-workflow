name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch this branch without marketplace actions
        run: |
          branch="${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"
          git clone --depth 1 --branch "$branch" "https://github.com/$GITHUB_REPOSITORY.git" repo
      - name: Show runtime
        working-directory: repo
        run: python3 --version
      - name: Compile source
        working-directory: repo
        run: python3 -m compileall -q src
      - name: Run behavior tests
        working-directory: repo
        run: PYTHONPATH=src python3 -m unittest discover -s tests
      - name: Verify public documentation
        working-directory: repo
        run: |
          test -s docs/workflow.svg
          test -s SECURITY.md
          test -s PROVENANCE.md
