[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-booking-workflow"
version = "0.1.0"
description = "A deterministic booking FSM that binds AI conversation to real offered availability and exact confirmation."
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["voice-ai","booking","state-machine","human-handoff","automation"]

[tool.setuptools.packages.find]
where = ["src"]
